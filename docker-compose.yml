services:
  postgres:
    image: postgres:16
    environment: {POSTGRES_USER: prnorms, POSTGRES_PASSWORD: prnorms, POSTGRES_DB: prnorms}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prnorms -d prnorms"]
      interval: 2s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
  backend:
    build: ./backend
    env_file: .env
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes: ["./backend:/app", "hf-cache:/root/.cache/huggingface"]
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
  worker:
    build: ./backend
    env_file: .env
    command: celery -A app.tasks.celery worker --loglevel=info
    volumes: ["./backend:/app", "hf-cache:/root/.cache/huggingface"]
    depends_on: [backend, redis]
  frontend:
    image: node:22-alpine
    working_dir: /frontend
    # npm ci installs exactly what the lockfile pins and never rewrites it.
    command: sh -c "npm ci && npm run dev"
    environment: {VITE_API_PROXY_TARGET: "http://backend:8000"}
    # Keep Linux node_modules separate from any host install.
    volumes: ["./frontend:/frontend", "/frontend/node_modules"]
    ports: ["5173:5173"]
    depends_on: [backend]

volumes:
  pgdata:
  hf-cache:
