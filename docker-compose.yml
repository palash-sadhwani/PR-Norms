services:
  postgres:
    image: postgres:16
    environment: {POSTGRES_USER: prnorms, POSTGRES_PASSWORD: prnorms, POSTGRES_DB: prnorms}
    ports: ["5432:5432"]
  redis:
    image: redis:7-alpine
  backend:
    build: ./backend
    env_file: .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes: ["./backend:/app"]
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
  worker:
    build: ./backend
    env_file: .env
    command: celery -A app.tasks.celery worker --loglevel=info
    volumes: ["./backend:/app"]
    depends_on: [backend, redis]
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes: ["./frontend:/app"]
    ports: ["5173:5173"]
    depends_on: [backend]
