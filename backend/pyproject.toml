[project]
name = "pr-norms-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
 "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy[asyncio]>=2.0",
 "asyncpg>=0.29", "aiosqlite>=0.20", "alembic>=1.13", "pydantic-settings>=2.5",
 "httpx>=0.27", "PyJWT>=2.9", "cryptography>=43", "celery[redis]>=5.4"
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.6", "black>=24"]
phase2 = ["sentence-transformers>=3.0", "hdbscan>=0.8.38"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
ignore = ["B008", "SIM117"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
